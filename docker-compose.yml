services:
  x-archive-explorer:
    build: .
    container_name: x-archive-explorer
    ports:
      - "5000:5000"
    environment:
      XAE_ENV: production
      XAE_SECRET_KEY: ${XAE_SECRET_KEY:?XAE_SECRET_KEY is required}
      XAE_ADMIN_USERNAME: ${XAE_ADMIN_USERNAME:-admin}
      XAE_ADMIN_EMAIL: ${XAE_ADMIN_EMAIL:-admin@localhost}
      XAE_ADMIN_PASSWORD: ${XAE_ADMIN_PASSWORD:?XAE_ADMIN_PASSWORD is required}
      XAE_PORT: ${XAE_PORT:-5000}
      XAE_MAX_UPLOAD_MB: ${XAE_MAX_UPLOAD_MB:-200}
      XAE_MEDIA_MAX_FILE_MB: ${XAE_MEDIA_MAX_FILE_MB:-25}
      XAE_MEDIA_MAX_TOTAL_MB: ${XAE_MEDIA_MAX_TOTAL_MB:-500}
      XAE_MEDIA_MAX_FILES: ${XAE_MEDIA_MAX_FILES:-5000}
      XAE_ITEMS_PER_PAGE: ${XAE_ITEMS_PER_PAGE:-25}
      XAE_USER_ITEMS_PER_PAGE: ${XAE_USER_ITEMS_PER_PAGE:-25}
      XAE_ARCHIVE_DETAIL_ITEMS_PER_PAGE: ${XAE_ARCHIVE_DETAIL_ITEMS_PER_PAGE:-20}
      XAE_CONVERSATION_ITEMS_PER_PAGE: ${XAE_CONVERSATION_ITEMS_PER_PAGE:-50}
      XAE_ARCHIVE_FILTER_MAX_OPTIONS: ${XAE_ARCHIVE_FILTER_MAX_OPTIONS:-300}
      XAE_DASHBOARD_ARCHIVES_PER_PAGE: ${XAE_DASHBOARD_ARCHIVES_PER_PAGE:-8}
      XAE_DASHBOARD_CACHE_TTL_SECONDS: ${XAE_DASHBOARD_CACHE_TTL_SECONDS:-30}
      XAE_SECURE_COOKIES: ${XAE_SECURE_COOKIES:-true}
      XAE_TRUST_PROXY_HEADERS: ${XAE_TRUST_PROXY_HEADERS:-true}
      XAE_PROXY_FIX_X_FOR: ${XAE_PROXY_FIX_X_FOR:-1}
      XAE_PROXY_FIX_X_PROTO: ${XAE_PROXY_FIX_X_PROTO:-1}
      XAE_PROXY_FIX_X_HOST: ${XAE_PROXY_FIX_X_HOST:-0}
      XAE_PROXY_FIX_X_PORT: ${XAE_PROXY_FIX_X_PORT:-0}
      XAE_PROXY_FIX_X_PREFIX: ${XAE_PROXY_FIX_X_PREFIX:-0}
      XAE_FORCE_HTTPS: ${XAE_FORCE_HTTPS:-false}
      XAE_ENABLE_HSTS: ${XAE_ENABLE_HSTS:-true}
      XAE_HSTS_MAX_AGE_SECONDS: ${XAE_HSTS_MAX_AGE_SECONDS:-31536000}
      XAE_HSTS_INCLUDE_SUBDOMAINS: ${XAE_HSTS_INCLUDE_SUBDOMAINS:-true}
      XAE_HSTS_PRELOAD: ${XAE_HSTS_PRELOAD:-false}
      XAE_PREFERRED_URL_SCHEME: ${XAE_PREFERRED_URL_SCHEME:-https}
      XAE_AUTO_CREATE_SCHEMA: ${XAE_AUTO_CREATE_SCHEMA:-false}
      XAE_IMPORT_ASYNC: ${XAE_IMPORT_ASYNC:-true}
      XAE_IMPORT_MAX_RETRIES: ${XAE_IMPORT_MAX_RETRIES:-2}
      XAE_IMPORT_WORKER_SLEEP_SECONDS: ${XAE_IMPORT_WORKER_SLEEP_SECONDS:-2}
      XAE_IMPORT_STALLED_JOB_MINUTES: ${XAE_IMPORT_STALLED_JOB_MINUTES:-30}
      XAE_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${XAE_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      XAE_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${XAE_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      XAE_LOGIN_RATE_LIMIT_BLOCK_SECONDS: ${XAE_LOGIN_RATE_LIMIT_BLOCK_SECONDS:-300}
      XAE_ARCHIVE_MEMBER_MAX_FILE_MB: ${XAE_ARCHIVE_MEMBER_MAX_FILE_MB:-25}
      XAE_ARCHIVE_MAX_TOTAL_MB: ${XAE_ARCHIVE_MAX_TOTAL_MB:-200}
      XAE_STORE_RAW_JSON: ${XAE_STORE_RAW_JSON:-true}
      XAE_EXPORT_MAX_POSTS: ${XAE_EXPORT_MAX_POSTS:-5000}
      XAE_X_API_ENABLED: ${XAE_X_API_ENABLED:-false}
      XAE_X_API_BASE_URL: ${XAE_X_API_BASE_URL:-https://api.x.com/2}
      XAE_X_API_BEARER_TOKEN: ${XAE_X_API_BEARER_TOKEN:-}
      XAE_X_API_TIMEOUT_SECONDS: ${XAE_X_API_TIMEOUT_SECONDS:-20}
      XAE_X_API_MAX_RETRIES: ${XAE_X_API_MAX_RETRIES:-2}
      XAE_X_API_BACKOFF_SECONDS: ${XAE_X_API_BACKOFF_SECONDS:-1.0}
      XAE_X_API_MAX_BACKOFF_SECONDS: ${XAE_X_API_MAX_BACKOFF_SECONDS:-10.0}
      XAE_X_API_ADAPTIVE_RATE_LIMIT_ENABLED: ${XAE_X_API_ADAPTIVE_RATE_LIMIT_ENABLED:-true}
      XAE_X_API_RATE_LIMIT_MAX_WAIT_SECONDS: ${XAE_X_API_RATE_LIMIT_MAX_WAIT_SECONDS:-60}
      XAE_OPS_METRICS_RETENTION_DAYS: ${XAE_OPS_METRICS_RETENTION_DAYS:-90}
      XAE_LOG_LEVEL: ${XAE_LOG_LEVEL:-INFO}
      XAE_ACCESS_LOG_ENABLED: ${XAE_ACCESS_LOG_ENABLED:-true}
      XAE_REQUEST_ID_HEADER: ${XAE_REQUEST_ID_HEADER:-X-Request-ID}
      XAE_REQUEST_ID_ACCEPT_INCOMING: ${XAE_REQUEST_ID_ACCEPT_INCOMING:-true}
      XAE_GUNICORN_WORKERS: ${XAE_GUNICORN_WORKERS:-2}
      XAE_GUNICORN_THREADS: ${XAE_GUNICORN_THREADS:-2}
      XAE_GUNICORN_TIMEOUT: ${XAE_GUNICORN_TIMEOUT:-60}
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  x-archive-worker:
    build: .
    container_name: x-archive-worker
    command: ["flask", "--app", "run.py", "run-import-worker"]
    environment:
      XAE_ENV: production
      XAE_SECRET_KEY: ${XAE_SECRET_KEY:?XAE_SECRET_KEY is required}
      XAE_ADMIN_USERNAME: ${XAE_ADMIN_USERNAME:-admin}
      XAE_ADMIN_EMAIL: ${XAE_ADMIN_EMAIL:-admin@localhost}
      XAE_ADMIN_PASSWORD: ${XAE_ADMIN_PASSWORD:?XAE_ADMIN_PASSWORD is required}
      XAE_PORT: ${XAE_PORT:-5000}
      XAE_MAX_UPLOAD_MB: ${XAE_MAX_UPLOAD_MB:-200}
      XAE_MEDIA_MAX_FILE_MB: ${XAE_MEDIA_MAX_FILE_MB:-25}
      XAE_MEDIA_MAX_TOTAL_MB: ${XAE_MEDIA_MAX_TOTAL_MB:-500}
      XAE_MEDIA_MAX_FILES: ${XAE_MEDIA_MAX_FILES:-5000}
      XAE_ITEMS_PER_PAGE: ${XAE_ITEMS_PER_PAGE:-25}
      XAE_USER_ITEMS_PER_PAGE: ${XAE_USER_ITEMS_PER_PAGE:-25}
      XAE_ARCHIVE_DETAIL_ITEMS_PER_PAGE: ${XAE_ARCHIVE_DETAIL_ITEMS_PER_PAGE:-20}
      XAE_CONVERSATION_ITEMS_PER_PAGE: ${XAE_CONVERSATION_ITEMS_PER_PAGE:-50}
      XAE_ARCHIVE_FILTER_MAX_OPTIONS: ${XAE_ARCHIVE_FILTER_MAX_OPTIONS:-300}
      XAE_DASHBOARD_ARCHIVES_PER_PAGE: ${XAE_DASHBOARD_ARCHIVES_PER_PAGE:-8}
      XAE_DASHBOARD_CACHE_TTL_SECONDS: ${XAE_DASHBOARD_CACHE_TTL_SECONDS:-30}
      XAE_SECURE_COOKIES: ${XAE_SECURE_COOKIES:-true}
      XAE_TRUST_PROXY_HEADERS: ${XAE_TRUST_PROXY_HEADERS:-true}
      XAE_PROXY_FIX_X_FOR: ${XAE_PROXY_FIX_X_FOR:-1}
      XAE_PROXY_FIX_X_PROTO: ${XAE_PROXY_FIX_X_PROTO:-1}
      XAE_PROXY_FIX_X_HOST: ${XAE_PROXY_FIX_X_HOST:-0}
      XAE_PROXY_FIX_X_PORT: ${XAE_PROXY_FIX_X_PORT:-0}
      XAE_PROXY_FIX_X_PREFIX: ${XAE_PROXY_FIX_X_PREFIX:-0}
      XAE_FORCE_HTTPS: ${XAE_FORCE_HTTPS:-false}
      XAE_ENABLE_HSTS: ${XAE_ENABLE_HSTS:-true}
      XAE_HSTS_MAX_AGE_SECONDS: ${XAE_HSTS_MAX_AGE_SECONDS:-31536000}
      XAE_HSTS_INCLUDE_SUBDOMAINS: ${XAE_HSTS_INCLUDE_SUBDOMAINS:-true}
      XAE_HSTS_PRELOAD: ${XAE_HSTS_PRELOAD:-false}
      XAE_PREFERRED_URL_SCHEME: ${XAE_PREFERRED_URL_SCHEME:-https}
      XAE_AUTO_CREATE_SCHEMA: ${XAE_AUTO_CREATE_SCHEMA:-false}
      XAE_IMPORT_ASYNC: ${XAE_IMPORT_ASYNC:-true}
      XAE_IMPORT_MAX_RETRIES: ${XAE_IMPORT_MAX_RETRIES:-2}
      XAE_IMPORT_WORKER_SLEEP_SECONDS: ${XAE_IMPORT_WORKER_SLEEP_SECONDS:-2}
      XAE_IMPORT_STALLED_JOB_MINUTES: ${XAE_IMPORT_STALLED_JOB_MINUTES:-30}
      XAE_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${XAE_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      XAE_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${XAE_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      XAE_LOGIN_RATE_LIMIT_BLOCK_SECONDS: ${XAE_LOGIN_RATE_LIMIT_BLOCK_SECONDS:-300}
      XAE_ARCHIVE_MEMBER_MAX_FILE_MB: ${XAE_ARCHIVE_MEMBER_MAX_FILE_MB:-25}
      XAE_ARCHIVE_MAX_TOTAL_MB: ${XAE_ARCHIVE_MAX_TOTAL_MB:-200}
      XAE_STORE_RAW_JSON: ${XAE_STORE_RAW_JSON:-true}
      XAE_EXPORT_MAX_POSTS: ${XAE_EXPORT_MAX_POSTS:-5000}
      XAE_X_API_ENABLED: ${XAE_X_API_ENABLED:-false}
      XAE_X_API_BASE_URL: ${XAE_X_API_BASE_URL:-https://api.x.com/2}
      XAE_X_API_BEARER_TOKEN: ${XAE_X_API_BEARER_TOKEN:-}
      XAE_X_API_TIMEOUT_SECONDS: ${XAE_X_API_TIMEOUT_SECONDS:-20}
      XAE_X_API_MAX_RETRIES: ${XAE_X_API_MAX_RETRIES:-2}
      XAE_X_API_BACKOFF_SECONDS: ${XAE_X_API_BACKOFF_SECONDS:-1.0}
      XAE_X_API_MAX_BACKOFF_SECONDS: ${XAE_X_API_MAX_BACKOFF_SECONDS:-10.0}
      XAE_X_API_ADAPTIVE_RATE_LIMIT_ENABLED: ${XAE_X_API_ADAPTIVE_RATE_LIMIT_ENABLED:-true}
      XAE_X_API_RATE_LIMIT_MAX_WAIT_SECONDS: ${XAE_X_API_RATE_LIMIT_MAX_WAIT_SECONDS:-60}
      XAE_OPS_METRICS_RETENTION_DAYS: ${XAE_OPS_METRICS_RETENTION_DAYS:-90}
      XAE_LOG_LEVEL: ${XAE_LOG_LEVEL:-INFO}
      XAE_ACCESS_LOG_ENABLED: ${XAE_ACCESS_LOG_ENABLED:-true}
      XAE_REQUEST_ID_HEADER: ${XAE_REQUEST_ID_HEADER:-X-Request-ID}
      XAE_REQUEST_ID_ACCEPT_INCOMING: ${XAE_REQUEST_ID_ACCEPT_INCOMING:-true}
      XAE_GUNICORN_WORKERS: ${XAE_GUNICORN_WORKERS:-2}
      XAE_GUNICORN_THREADS: ${XAE_GUNICORN_THREADS:-2}
      XAE_GUNICORN_TIMEOUT: ${XAE_GUNICORN_TIMEOUT:-60}
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    depends_on:
      x-archive-explorer:
        condition: service_healthy
    restart: unless-stopped
