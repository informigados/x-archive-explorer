  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#xae-bg)"/>
  <rect x="18" y="18" width="92" height="92" rx="20" fill="#0b4f4a" opacity="0.42"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
